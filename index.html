<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CinePremiadas · Películas premiadas al azar</title>
<meta name="description" content="Descubre películas ganadoras del Óscar, la Palma de Oro, el Goya, el León de Oro y el Oso de Oro. Marca las que has visto y puntúalas.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://ghjsbcbeyjbldzjdnakt.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e0d0b;
    --bg-soft: #161310;
    --panel: #1c1815;
    --panel-line: #33291f;
    --ink: #f2ece1;
    --ink-dim: #c9bfae;
    --ink-faint: #8b8071;
    --gold: #cf9e3f;
    --gold-soft: #e6c878;
    --crimson: #a5312f;
    --teal: #3e6b63;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]){ color-scheme: dark; }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg: #f4ede0; --bg-soft: #ece2d0; --panel: #fbf6ec; --panel-line: #ddccae;
      --ink: #211a12; --ink-dim: #4f4534; --ink-faint: #7d715a;
    }
  }
  :root[data-theme="light"]{
    --bg: #f4ede0; --bg-soft: #ece2d0; --panel: #fbf6ec; --panel-line: #ddccae;
    --ink: #211a12; --ink-dim: #4f4534; --ink-faint: #7d715a;
  }

  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  html{ scroll-padding-top: var(--safe-top); }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(207,158,63,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(165,49,47,0.08), transparent 55%);
  }
  h1,h2,h3,.display{ font-family:'Fraunces', Georgia, serif; }

  .wrap{ max-width: 760px; margin: 0 auto; padding: 0 20px 64px; }

  header.top{
    padding: 30px 20px 18px; display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    max-width: 760px; margin:0 auto;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .mark{ font-family:'Fraunces', serif; font-weight:700; font-size:26px; letter-spacing:0.01em; }
  .brand .mark em{ font-style: italic; color: var(--gold-soft); }
  .brand .sub{ color: var(--ink-faint); font-size:12.5px; }

  nav.tabs{
    display:flex; gap:4px; background: var(--panel); border:1px solid var(--panel-line);
    border-radius:999px; padding:4px; margin: 6px auto 22px; max-width: fit-content;
  }
  nav.tabs button{
    appearance:none; border:none; background:transparent; color: var(--ink-dim);
    font-family:'Inter'; font-weight:600; font-size:13.5px; padding:9px 18px;
    border-radius:999px; cursor:pointer; transition: background .18s ease, color .18s ease;
  }
  nav.tabs button.active{ background: var(--gold); color:#241a06; }
  nav.tabs button:not(.active):hover{ color: var(--ink); }

  section.view{ display:none; }
  section.view.active{ display:block; }

  .progress-card{
    background: var(--panel); border:1px solid var(--panel-line); border-radius:16px;
    padding:16px 18px; margin-bottom:20px; display:flex; align-items:center; gap:16px;
  }
  .progress-card .pnum{ font-family:'Fraunces'; font-weight:700; font-size:22px; flex:none; }
  .progress-card .pbar-wrap{ flex:1; min-width:0; }
  .progress-card .plabel{ font-size:11.5px; color: var(--ink-faint); margin-bottom:6px; display:flex; justify-content:space-between; }
  .progress-card .pbar{ height:7px; border-radius:999px; background: var(--bg-soft); overflow:hidden; border:1px solid var(--panel-line); }
  .progress-card .pbar > div{ height:100%; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); border-radius:999px; transition: width .4s ease; }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .chip{
    display:flex; align-items:center; gap:7px; border:1px solid var(--panel-line); background: var(--panel);
    padding:8px 14px 8px 10px; border-radius:999px; cursor:pointer; user-select:none;
    font-size:13px; font-weight:600; color: var(--ink-dim); transition: border-color .15s, color .15s;
  }
  .chip input{ accent-color: var(--gold); width:15px; height:15px; margin:0; }
  .chip.on{ color: var(--ink); border-color: var(--dot-color, var(--gold)); }
  .chip .dot{ width:8px; height:8px; border-radius:50%; background: var(--dot-color); flex:none; }
  .chip small{ font-weight:400; color: var(--ink-faint); }

  .mode-row{ display:flex; gap:6px; margin-bottom:22px; }
  .mode-btn{
    flex:1; appearance:none; border:1px solid var(--panel-line); background: var(--bg-soft); color: var(--ink-dim);
    font-family:'Inter'; font-weight:600; font-size:12.5px; padding:9px 10px; border-radius:10px; cursor:pointer;
  }
  .mode-btn.active{ background: var(--teal); border-color: var(--teal); color:#eafaf5; }

  .sort-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .sort-row .sort-label{ font-size:11.5px; color: var(--ink-faint); }
  .sort-btn{
    appearance:none; border:1px solid var(--panel-line); background: var(--panel); color: var(--ink-dim);
    font-family:'Inter'; font-weight:600; font-size:12px; padding:7px 12px; border-radius:999px; cursor:pointer;
  }
  .sort-btn.active{ background: var(--gold); border-color: var(--gold); color:#241a06; }
  .sort-select{
    appearance:none; border:1px solid var(--panel-line); background: var(--panel); color: var(--ink);
    font-family:'Inter'; font-weight:600; font-size:12.5px; padding:8px 30px 8px 12px; border-radius:10px; cursor:pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0' fill='none' stroke='%238b8071' stroke-width='1.4'/></svg>");
    background-repeat:no-repeat; background-position: right 12px center;
  }

  .roll-area{ text-align:center; padding: 10px 0 6px; }
  .roll-btn{
    appearance:none; border:none; cursor:pointer;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#241a06; font-family:'Inter'; font-weight:700; font-size:15px;
    padding:15px 30px; border-radius:14px; letter-spacing:0.01em;
    box-shadow: 0 10px 24px -10px rgba(207,158,63,0.55);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .roll-btn:hover{ transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(207,158,63,0.65); }
  .roll-btn:active{ transform: translateY(0); }
  .roll-btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .roll-hint{ margin-top:10px; font-size:12.5px; color: var(--ink-faint); min-height:16px; }

  .card{
    margin-top:26px; background: var(--panel); border:1px solid var(--panel-line);
    border-radius:20px; padding:30px 26px 26px; position:relative; overflow:hidden;
    animation: rise .38s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(10px); } to{ opacity:1; transform:none; } }
  .card::before{ content:""; position:absolute; inset:0 0 auto 0; height:4px; background: var(--card-accent, var(--gold)); }
  .badge{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
    letter-spacing:0.06em; padding:5px 11px 5px 9px; border-radius:999px;
    background: color-mix(in srgb, var(--card-accent, var(--gold)) 18%, transparent);
    color: var(--card-accent, var(--gold-soft));
    border:1px solid color-mix(in srgb, var(--card-accent, var(--gold)) 45%, transparent);
  }
  .badge .dot{ width:7px; height:7px; border-radius:50%; background: currentColor; }
  .card h2{ margin: 16px 0 4px; font-size: 27px; line-height:1.18; font-weight:600; }
  .card .meta{ color: var(--ink-dim); font-size:14px; display:flex; flex-wrap:wrap; gap:5px 10px; }
  .card .meta b{ color: var(--ink); font-weight:600; }
  .card .meta .sep{ color: var(--ink-faint); }
  .card .synopsis{ margin-top:14px; color: var(--ink-dim); font-size:14.5px; line-height:1.55; }
  .card .otherawards{
    margin-top:14px; font-size:12.5px; color: var(--ink-faint); display:flex; gap:8px; align-items:flex-start;
  }
  .card .otherawards b{ color: var(--gold-soft); font-weight:600; }

  .card .actions{ margin-top: 22px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .btn{
    appearance:none; cursor:pointer; font-family:'Inter'; font-weight:600; font-size:13.5px;
    padding:10px 16px; border-radius:10px; border:1px solid var(--panel-line); background: var(--bg-soft); color: var(--ink);
  }
  .btn:hover{ border-color: var(--ink-faint); }
  .btn.primary{ background: var(--teal); border-color: var(--teal); color:#eafaf5; }
  .btn.primary:hover{ filter: brightness(1.08); }
  .watched-tag{
    display:inline-flex; align-items:center; gap:7px; font-size:13px; color: var(--ink-dim);
    background: var(--bg-soft); border:1px solid var(--panel-line); padding:8px 13px; border-radius:10px;
  }
  .watched-tag b{ color: var(--gold-soft); }

  .rate-box{ margin-top:18px; padding-top:18px; border-top:1px dashed var(--panel-line); display:none; }
  .rate-box.open{ display:block; }
  .rate-box label{ font-size:12.5px; color: var(--ink-faint); display:block; margin-bottom:9px; }
  .rate-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .rate-pip{
    width:33px; height:33px; border-radius:9px; border:1px solid var(--panel-line);
    background: var(--bg-soft); color: var(--ink-dim); font-weight:600; font-size:13.5px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .rate-pip.sel{ background: var(--gold); border-color: var(--gold); color:#241a06; }
  .rate-confirm{ margin-top:14px; display:flex; gap:10px; }

  .poster{ margin:-30px -26px 18px; padding:22px 26px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; min-height:92px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.45); }
  .poster span{ font-family:'Fraunces',serif; font-weight:700; font-size:44px; line-height:1; opacity:.92; }
  .poster em{ font-family:'Fraunces',serif; font-size:13px; opacity:.85; text-align:right; max-width:55%; }
  .links{ margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
  .links a{ font-size:12px; font-weight:600; color:var(--ink-dim); text-decoration:none; border:1px solid var(--panel-line); background:var(--bg-soft); padding:6px 11px; border-radius:999px; }
  .links a:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .rate-extra{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  .rate-extra textarea,.rate-extra input,.search-input,.filter-sel{ width:100%; background:var(--bg-soft); color:var(--ink); border:1px solid var(--panel-line); border-radius:10px; padding:9px 12px; font-family:'Inter'; font-size:13px; }
  .rate-extra textarea{ min-height:64px; resize:vertical; }
  .rate-extra label{ margin:0 0 4px; }
  .search-input{ margin-bottom:14px; }
  .filter-sel{ flex:1; width:auto; min-width:140px; }
  .row .cmt{ font-size:12px; color:var(--ink-dim); margin-top:4px; font-style:italic; }
  .wish-star{ color:var(--gold-soft); }
  .share-btn{ margin-bottom:18px; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin:7px 0; font-size:13px; }
  .bar-row .bl{ width:38%; min-width:90px; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-row .bt{ flex:1; height:8px; background:var(--bg-soft); border:1px solid var(--panel-line); border-radius:999px; overflow:hidden; }
  .bar-row .bt div{ height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-soft)); }
  .bar-row .bv{ width:64px; text-align:right; font-weight:600; }
  .stat-h{ font-family:'Fraunces'; font-size:16px; margin:22px 0 6px; }
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-box{ background:var(--panel); border:1px solid var(--panel-line); border-radius:16px; padding:18px; max-width:480px; width:100%; max-height:92vh; overflow:auto; }
  .modal-box img{ width:100%; border-radius:10px; display:block; margin-bottom:10px; }
  .modal-box textarea{ width:100%; min-height:90px; background:var(--bg-soft); color:var(--ink); border:1px solid var(--panel-line); border-radius:10px; padding:8px; font-size:12px; margin-bottom:10px; }
  .auth-box{ text-align:center; }
  .auth-box h2{ font-family:'Fraunces',serif; margin:0 0 6px; }
  .auth-box p{ color:var(--ink-dim); font-size:13.5px; margin:0 0 14px; }
  .auth-box input{ width:100%; background:var(--bg-soft); color:var(--ink); border:1px solid var(--panel-line); border-radius:10px; padding:11px 12px; font-size:14px; margin-bottom:10px; }
  .auth-box .btn{ width:100%; margin-bottom:8px; }
  .auth-msg{ font-size:12.5px; color:var(--gold-soft); min-height:18px; }
  .toast{
    position:fixed; left:50%; bottom: calc(26px + var(--safe-bottom));
    transform: translateX(-50%) translateY(14px); opacity:0; pointer-events:none;
    background: var(--gold); color:#241a06; font-weight:700; font-size:13.5px;
    padding:11px 20px; border-radius:999px; transition: all .22s ease; z-index:50;
    box-shadow: 0 14px 30px -8px rgba(0,0,0,0.45);
  }
  .toast.show{ transform: translateX(-50%) translateY(0); opacity:1; }

  .subtabs{ display:flex; gap:8px; margin-bottom:18px; }
  .subtabs button{
    appearance:none; border:1px solid var(--panel-line); background:var(--panel); color: var(--ink-dim);
    font-family:'Inter'; font-weight:600; font-size:13px; padding:8px 15px; border-radius:10px; cursor:pointer;
  }
  .subtabs button.active{ background: var(--bg-soft); color: var(--ink); border-color: var(--ink-faint); }

  .stat-row{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .stat{ flex:1; min-width:110px; background: var(--panel); border:1px solid var(--panel-line); border-radius:14px; padding:14px 16px; }
  .stat .n{ font-family:'Fraunces'; font-size:24px; font-weight:600; }
  .stat .l{ font-size:11.5px; color: var(--ink-faint); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }

  .list{ display:flex; flex-direction:column; gap:10px; }
  .row{ background: var(--panel); border:1px solid var(--panel-line); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:14px; }
  .row .pos{ font-family:'Fraunces'; font-weight:600; font-size:16px; color: var(--ink-faint); width:26px; flex:none; text-align:center; }
  .row .info{ flex:1; min-width:0; }
  .row .info h4{ margin:0 0 3px; font-size:15px; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .info .sub{ font-size:12px; color: var(--ink-faint); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row .score{
    flex:none; font-family:'Fraunces'; font-weight:700; font-size:17px; background: var(--bg-soft);
    border:1px solid var(--panel-line); color: var(--gold-soft); width:40px; height:40px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
  }
  .row .edit{ flex:none; border:none; background:transparent; color: var(--ink-faint); cursor:pointer; font-size:12px; padding:6px; text-decoration:underline; text-underline-offset:2px; }
  .row.pending{ opacity:0.9; }
  .row .mark-btn{
    flex:none; border:1px solid var(--panel-line); background: var(--teal); color:#eafaf5; cursor:pointer;
    font-size:12px; font-weight:600; padding:8px 12px; border-radius:9px;
  }

  .empty{ text-align:center; padding: 50px 20px; color: var(--ink-faint); font-size:13.5px; background: var(--panel); border:1px dashed var(--panel-line); border-radius:16px; }
  .empty .display{ font-size:19px; color: var(--ink-dim); margin-bottom:6px; }

  .footnote{ text-align:center; color: var(--ink-faint); font-size:11.5px; margin-top:34px; line-height:1.6; }
  .footnote .status-ok{ color: #7fae8f; }
  .footnote .status-bad{ color: #c97b6d; }

  @media (max-width: 480px){
    .card h2{ font-size:23px; }
    .roll-btn{ width:100%; }
    header.top{ padding-top: 22px; }
    .mode-row{ flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="mark">Cine<em>Premiadas</em></div>
    <div class="sub">Óscar · Cannes · Goya · Venecia · Berlín</div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs">
    <button class="tab-btn active" data-view="discover">Descubrir</button>
    <button class="tab-btn" data-view="collection">Mi colección</button>
  </nav>

  <!-- DESCUBRIR -->
  <section id="view-discover" class="view active">
    <div class="progress-card" id="progressCard"></div>

    <div class="filters" id="filters"></div>
    <div class="mode-row" id="modeRow"></div>
    <div class="mode-row"><select class="filter-sel" id="decadeSel"><option value="">Todas las décadas</option></select><select class="filter-sel" id="countrySel"><option value="">Todos los países</option></select></div>

    <div class="roll-area">
      <button class="roll-btn" id="rollBtn">🎬 Elegir película al azar</button>
      <div class="roll-hint" id="rollHint"></div>
    </div>

    <div id="cardHolder"></div>
  </section>

  <!-- COLECCIÓN -->
  <section id="view-collection" class="view">
    <div class="stat-row" id="statRow"></div>
    <div class="subtabs">
      <button class="sub-btn active" data-sub="history">Historial</button>
      <button class="sub-btn" data-sub="ranking">Ranking</button>
      <button class="sub-btn" data-sub="pending">Por ver</button>
      <button class="sub-btn" data-sub="stats">Estadísticas</button>
    </div>
    <button class="btn share-btn" id="shareBtn">📤 Compartir ranking</button>
    <input class="search-input" id="searchInput" type="search" placeholder="Buscar por título o director…">
    <div id="collectionBody"></div>
  </section>

  <div class="footnote" id="footnote"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------------------
   BASE DE DATOS DE PELÍCULAS
   [award, year, title, director, country, synopsis, otherAwards]
   award: "oscar" | "cannes" | "goya"
--------------------------------------------------------------------- */
const RAW_MOVIES = [
// ================= OSCAR: MEJOR PELÍCULA =================
["oscar",1927,"Alas","William A. Wellman","EE. UU.","Dos aviadores rivales se hacen amigos y combaten juntos en los cielos de la Primera Guerra Mundial.",""],
["oscar",1928,"La melodía de Broadway","Harry Beaumont","EE. UU.","Dos hermanas artistas de variedades compiten por el mismo hombre en el Nueva York del espectáculo.",""],
["oscar",1929,"Sin novedad en el frente","Lewis Milestone","EE. UU.","Un joven soldado alemán descubre el horror y la desilusión de la guerra en las trincheras.","Mejor Director"],
["oscar",1930,"Cimarrón","Wesley Ruggles","EE. UU.","Una familia pionera se instala en el Oeste durante la fiebre de tierras de Oklahoma.","Mejor Guion"],
["oscar",1931,"Gran Hotel","Edmund Goulding","EE. UU.","Las vidas de varios huéspedes de un lujoso hotel berlinés se entrelazan durante unos días decisivos.",""],
["oscar",1932,"Cabalgata","Frank Lloyd","EE. UU.","Una familia británica atraviesa tres décadas de cambios históricos, desde la guerra de los Bóers hasta los años 30.","Mejor Director"],
["oscar",1934,"Sucedió una noche","Frank Capra","EE. UU.","Una heredera fugitiva y un periodista desencantado viven un romance improvisado en un viaje en autobús.","Mejor Director, Mejor Actor, Mejor Actriz, Mejor Guion"],
["oscar",1935,"Rebelión a bordo","Frank Lloyd","EE. UU.","La tripulación del HMS Bounty se subleva contra un capitán tiránico en el Pacífico del siglo XVIII.",""],
["oscar",1936,"El gran Ziegfeld","Robert Z. Leonard","EE. UU.","Biografía musical del legendario productor de Broadway Florenz Ziegfeld y sus fastuosos espectáculos.","Mejor Actriz"],

    out[id] = { rating:r, comment:String(w.comment||"").slice(0,500), watchedAt:Number(w.watchedAt)||Date.now(), title:m.title, award:m.award, year:m.year };
  });
  return out;
}
const cleanWish = a=> new Set((Array.isArray(a)?a:[]).filter(id=>MOVIES_BY_ID[id]));

function readLocal(){
  try{
    let d = JSON.parse(localStorage.getItem(lsKey()) || "null");
    if(!d && !user){ d = JSON.parse(localStorage.getItem("cinepremiadas:v1") || "null"); }
    return d;
  }catch(e){ return null; }
}
function writeLocal(dirty){
  try{ localStorage.setItem(lsKey(), JSON.stringify({ watched, wishlist:[...wishlist], dirty:!!dirty })); }catch(e){}
}
function loadLocalIntoState(){
  const d = readLocal();
  watched = d ? cleanWatched(d.watched) : {};
  wishlist = d ? cleanWish(d.wishlist) : new Set();
}

function persist(){
  writeLocal(!!user);
  if(user){ syncStatus = "Pendiente de sincronizar…"; clearTimeout(pushTimer); pushTimer = setTimeout(push, 800); }
  renderFootnote();
}
async function push(){
  if(!user || !sb) return;
  syncStatus = "Sincronizando…"; renderFootnote();
  const { error } = await sb.from("user_data").upsert({ user_id:user.id, watched, wishlist:[...wishlist], updated_at:new Date().toISOString() });
  if(error){ syncStatus = "Sin conexión: se reintentará"; clearTimeout(pushTimer); pushTimer = setTimeout(push, 15000); }
  else { syncStatus = "Sincronizado"; writeLocal(false); }
  renderFootnote();
}
async function pull(){
  if(!user || !sb) return;
  const { data, error } = await sb.from("user_data").select("watched,wishlist").eq("user_id", user.id).maybeSingle();
  if(error){ syncStatus = "Sin conexión: usando copia local"; renderFootnote(); return; }
  const local = readLocal();
  if(!data){
    const legacy = (()=>{ try{ return JSON.parse(localStorage.getItem("cinepremiadas:v1")||"null"); }catch(e){ return null; } })();
    if(legacy && !Object.keys(watched).length){ watched = cleanWatched(legacy.watched); wishlist = cleanWish(legacy.wishlist); }
    if(Object.keys(watched).length || wishlist.size){ try{ localStorage.removeItem("cinepremiadas:v1"); }catch(e){} await push(); } else { syncStatus = "Sincronizado"; }
  }else if(local && local.dirty){
    watched = { ...cleanWatched(data.watched), ...watched };
    wishlist = new Set([...cleanWish(data.wishlist), ...wishlist]);
    await push();
  }else{
    watched = cleanWatched(data.watched);
    wishlist = cleanWish(data.wishlist);
    writeLocal(false); syncStatus = "Sincronizado";
  }
  renderAll(); renderFootnote();
}

function renderFootnote(){
  const who = user ? `Sesión: ${esc(user.email||"")} · ${esc(syncStatus)}` : "Modo sin cuenta: datos solo en este navegador";
  footnote.innerHTML = `<span class="${user && /Sin conexión/.test(syncStatus) ? "status-bad" : "status-ok"}">●</span> ${who}<br><a href="#" id="expBtn">Exportar copia</a> · <a href="#" id="impBtn">Importar copia</a>${user || localOnly ? ' · <a href="#" id="outBtn">'+(user?"Cerrar sesión":"Iniciar sesión")+'</a>' : ""}<input type="file" id="impFile" accept="application/json" style="display:none">`;
  document.getElementById("expBtn").onclick = (e)=>{ e.preventDefault();
    const blob = new Blob([JSON.stringify({ watched, wishlist:[...wishlist] }, null, 2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "cinepremiadas-copia.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000); };
  document.getElementById("impBtn").onclick = (e)=>{ e.preventDefault(); document.getElementById("impFile").click(); };
  document.getElementById("impFile").onchange = (e)=>{
    const f = e.target.files[0]; if(!f || f.size > 2000000) return;
    const r = new FileReader();
    r.onload = ()=>{ try{ const d = JSON.parse(r.result); watched = cleanWatched(d.watched); wishlist = cleanWish(d.wishlist); persist(); renderAll(); showToast("Copia importada"); }catch(err){ showToast("Archivo no válido"); } };
    r.readAsText(f);
  };
  const out = document.getElementById("outBtn");
  if(out) out.onclick = async (e)=>{ e.preventDefault();
    if(user && sb){ await sb.auth.signOut(); } else { localOnly = false; showLogin(); } };
}

function showLogin(){
  if(document.getElementById("authModal")) return;
  const m = document.createElement("div"); m.className = "modal"; m.id = "authModal";
  m.innerHTML = `<div class="modal-box auth-box"><h2>CinePremiadas</h2>
    <p>Entra con tu correo para guardar tu historial y verlo en todos tus dispositivos. Recibirás un enlace de acceso, sin contraseña.</p>
    <input id="authEmail" type="email" autocomplete="email" placeholder="tu@correo.com">
    <button class="btn primary" id="authSend">Enviarme el enlace</button>
    <div class="auth-msg" id="authMsg"></div>
    <button class="btn" id="authLocal">Continuar sin cuenta (solo en este navegador)</button></div>`;
  document.body.appendChild(m);
  const msg = m.querySelector("#authMsg");
  m.querySelector("#authSend").onclick = async ()=>{
    const email = m.querySelector("#authEmail").value.trim();
    if(!/^\S+@\S+\.\S+$/.test(email)){ msg.textContent = "Escribe un correo válido."; return; }
    if(!sb){ msg.textContent = "No se pudo cargar el servicio de acceso."; return; }
    msg.textContent = "Enviando…";

    msg.textContent = (error && error.status === 429) ? "Demasiados intentos. Espera unos minutos." : "Si tu correo está invitado, recibirás un enlace en unos instantes.";
  };
  m.querySelector("#authLocal").onclick = ()=>{ localOnly = true; m.remove(); loadLocalIntoState(); renderAll(); renderFootnote(); };
}

async function handleSession(session){
  if(session && session.user){
    user = session.user; localOnly = false;
    const m = document.getElementById("authModal"); if(m) m.remove();
    loadLocalIntoState(); renderAll(); syncStatus = "Sincronizando…"; renderFootnote();
    await pull();
  }else{
    user = null; watched = {}; wishlist = new Set(); renderAll();
    if(!localOnly) showLogin(); else { loadLocalIntoState(); renderAll(); }
    renderFootnote();
  }
}
function initStorage(){
  renderFootnote();
  if(!sb){ localOnly = true; loadLocalIntoState(); renderAll(); renderFootnote(); return; }
  sb.auth.onAuthStateChange((ev, session)=>{ setTimeout(()=>handleSession(session), 0); });
}

async function saveWatched(movie, rating, comment="", dateStr=""){
  const ts = dateStr ? new Date(dateStr+"T12:00:00").getTime() : ((watched[movie.id]&&watched[movie.id].watchedAt) || Date.now());
  const ts_ = twinsOf(movie);
  ts_.forEach(t=>{ watched[t.id] = { rating, comment, watchedAt: ts, title:t.title, award:t.award, year:t.year }; });
  renderAll();
  persist();
}
async function unwatch(movie){
  const ts_ = twinsOf(movie);
  ts_.forEach(t=>{ delete watched[t.id]; });
  renderAll();
  persist();
}
async function toggleWish(movie){
  const on = !wishlist.has(movie.id);
  if(on) wishlist.add(movie.id); else wishlist.delete(movie.id);
  renderAll();
  persist();
}

function getPool(){
  return MOVIES.filter(m=>{
    if(!activeFilters.has(m.award)) return false;
    const dv = document.getElementById("decadeSel").value, cv = document.getElementById("countrySel").value;
    if(dv && Math.floor(m.year/10)*10 !== +dv) return false;
    if(cv && !m.country.split("/").map(x=>x.trim()).includes(cv)) return false;
    const isWatched = !!watched[m.id];
    if(viewMode==="unwatched" && isWatched) return false;
    if(viewMode==="watched" && !isWatched) return false;
    return true;
  });
}

function updateRollState(){
  const btn = document.getElementById("rollBtn");
  const hint = document.getElementById("rollHint");
  const pool = getPool();
  btn.disabled = pool.length === 0;
  hint.textContent = pool.length === 0
    ? "No hay películas con este filtro — prueba a cambiarlo"
    : pool.length + " película" + (pool.length===1?"":"s") + " en el filtro actual";
  renderProgress();
}

function renderProgress(){
  const total = MOVIES.filter(m=>activeFilters.has(m.award)).length;
  const done = MOVIES.filter(m=>activeFilters.has(m.award) && watched[m.id]).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById("progressCard").innerHTML = `
    <div class="pnum">${pct}%</div>
    <div class="pbar-wrap">
      <div class="plabel"><span>Reto: verlas todas</span><span>${done} / ${total}</span></div>
      <div class="pbar"><div style="width:${pct}%"></div></div>
    </div>
  `;
}

function pickRandom(){
  const pool = getPool(); if(!pool.length) return null;
  let fresh = pool.filter(m=>!seen.has(m.id) && !(currentMovie && m.id===currentMovie.id));
  if(!fresh.length){ seen.clear(); fresh = pool.filter(m=>!currentMovie || m.id!==currentMovie.id); if(!fresh.length) fresh = pool; showToast("Has recorrido todas: reiniciamos el sorteo"); }
  const m = fresh[Math.floor(Math.random()*fresh.length)];
  twinsOf(m).forEach(t=>seen.add(t.id));
  return m;
}
let rolling = false;
function roll(){
  const pool = getPool(); if(!pool.length || rolling) return;
  rolling = true;
  const hint = document.getElementById("rollHint"); let i = 0;
  const t = setInterval(()=>{
    hint.textContent = "🎞️ " + pool[Math.floor(Math.random()*pool.length)].title;
    if(++i >= 10){ clearInterval(t); rolling = false; currentMovie = pickRandom(); selectedRating = null; renderCard(); updateRollState(); }
  }, 70);
}
document.getElementById("rollBtn").addEventListener("click", roll);
(function initSel(){

})();

function watchedList(){
  const seenKeys = new Set();
  return watchedListRaw().filter(x=>{ const k = TWIN_KEY(x); if(seenKeys.has(k)) return false; seenKeys.add(k); return true; });
}
function watchedListRaw(){
  return Object.entries(watched).map(([id, w])=>{
    const movie = MOVIES_BY_ID[id] || { title:w.title, award:w.award, year:w.year, director:"" };
    return { id, ...movie, rating:w.rating, watchedAt:w.watchedAt };
  });
}

function renderStats(){
  const list = watchedList();
  const avg = list.length ? (list.reduce((s,x)=>s+x.rating,0)/list.length).toFixed(1) : "—";
  const best = list.length ? list.reduce((a,b)=> b.rating>a.rating? b:a) : null;

    <div class="stat"><div class="n">${UNIQUE_TOTAL - list.length}</div><div class="l">Por ver</div></div>
  `;

function truncate(s,n){ return s.length>n ? s.slice(0,n-1)+"…" : s; }

function buildAwardChipsHtml(filterSet, counts){
  return Object.entries(AWARD_META).map(([key, meta])=>{
    const count = counts[key] || 0;
    const on = filterSet.has(key);
    return `<label class="chip${on?' on':''}" data-key="${key}" style="--dot-color:${meta.color}">
      <input type="checkbox" ${on?"checked":""}>
      <span class="dot"></span>${meta.label} <small>(${count})</small>
    </label>`;
  }).join("");
}

function attachAwardChipsListeners(container, filterSet, rerender){
  container.querySelectorAll(".chip").forEach(label=>{
    label.querySelector("input").addEventListener("change", (e)=>{
      const key = label.getAttribute("data-key");
      if(e.target.checked) filterSet.add(key); else filterSet.delete(key);
      if(filterSet.size===0){ filterSet.add(key); e.target.checked = true; }
      rerender();
    });
  });
}

function applySort(items, tab){
  const mode = sortMode[tab];
  const out = items.slice();
  if(mode === "year-asc"){
    out.sort((a,b)=> a.year - b.year || a.title.localeCompare(b.title));
  }else if(mode === "year-desc"){
    out.sort((a,b)=> b.year - a.year || a.title.localeCompare(b.title));
  }else if(tab === "history"){
    out.sort((a,b)=> b.watchedAt - a.watchedAt);
  }else if(tab === "ranking"){
    out.sort((a,b)=> b.rating - a.rating || a.title.localeCompare(b.title));
  }else{
    out.sort((a,b)=> a.title.localeCompare(b.title));
  }
  return out;
}

function buildSortSelectHtml(tab){
  const mode = sortMode[tab];
  const defaultLabel = tab==="history" ? "Vistas más recientes" : tab==="ranking" ? "Mejor puntuadas" : "Alfabético";
  return `<div class="sort-row">
    <label class="sort-label">Ordenar por</label>
    <select class="sort-select" id="sortSelect">
      <option value="default" ${mode==="default"?"selected":""}>${defaultLabel}</option>
      <option value="year-asc" ${mode==="year-asc"?"selected":""}>Año de estreno ↑ (antiguas primero)</option>
      <option value="year-desc" ${mode==="year-desc"?"selected":""}>Año de estreno ↓ (recientes primero)</option>
    </select>
  </div>`;
}

function attachSortSelectListener(container, tab){
  const sel = container.querySelector("#sortSelect");
  if(!sel) return;
  sel.addEventListener("change", (e)=>{
    sortMode[tab] = e.target.value;
    renderCollection();
  });
}

        renderCard();
      });
    });
    return;
  }

  const fullList = watchedList();
  if(fullList.length===0){
    body.innerHTML = `<div class="empty"><div class="display">Aún no has visto ninguna</div>Marca películas como vistas desde “Descubrir” para construir tu historial y tu ranking.</div>`;
    return;
  }

  const watchedCounts = {};
  fullList.forEach(x=> watchedCounts[x.award] = (watchedCounts[x.award]||0)+1);
  const filtersHtml = buildAwardChipsHtml(watchedFilters, watchedCounts);
  const filtered = fullList.filter(x=>watchedFilters.has(x.award));
  const list = applySort(filtered, subTab);

  let itemsHtml;
  if(list.length===0){
    itemsHtml = `<div class="empty">No tienes películas vistas con este filtro.</div>`;
  }else if(subTab === "history"){
    itemsHtml = list.map(x=>rowHtml(x, formatDate(x.watchedAt))).join("");
  }else{
    itemsHtml = list.map((x,i)=>rowHtml(x, null, sortMode.ranking==="default" ? i+1 : null)).join("");
  }

  body.innerHTML = `<div class="filters">${filtersHtml}</div>${buildSortSelectHtml(subTab)}<div class="list">${itemsHtml}</div>`;
  attachAwardChipsListeners(body, watchedFilters, renderCollection);
  attachSortSelectListener(body, subTab);

  body.querySelectorAll("[data-edit]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.getAttribute("data-edit");
      const movie = MOVIES_BY_ID[id];
      if(!movie) return;
      document.querySelector('.tab-btn[data-view="discover"]').click();
      currentMovie = movie;
      renderCard();
      openRateBox(watched[id] ? watched[id].rating : null);
    });
  });
}

function rowHtml(x, dateStr, pos){
  const meta = AWARD_META[x.award] || {label:x.award, color:"#888"};
  return `
    <div class="row" data-q="${(x.title+' '+(x.director||'')).toLowerCase()}">
      ${pos ? `<div class="pos">${pos}</div>` : ""}
      <div class="info">
        <h4>${esc(x.title)}</h4>
        <div class="sub">
          <span style="color:${meta.color}">${meta.label}</span> · ${x.year}
          ${dateStr ? "· visto " + dateStr : ""}
        </div>
        ${x.comment ? `<div class="cmt">“${esc(x.comment)}”</div>` : ""}
      </div>
      <div class="score">${x.rating}</div>
      <button class="edit" data-edit="${x.id}">editar</button>
    </div>
  `;
}

function formatDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString("es-ES", { day:"numeric", month:"short", year:"numeric" });
}

/* ---------------------------------------------------------------------
   TOAST
--------------------------------------------------------------------- */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2600);
}

/* ---------------------------------------------------------------------
   INIT
--------------------------------------------------------------------- */
function applySearch(){
  const q = searchQ.trim().toLowerCase();
  document.querySelectorAll("#collectionBody .row[data-q]").forEach(r=>{ r.style.display = (!q || r.getAttribute("data-q").includes(q)) ? "" : "none"; });
}
function renderCollection(){ renderCollectionInner(); applySearch(); }
document.getElementById("searchInput").addEventListener("input", e=>{ searchQ = e.target.value; applySearch(); });

function barsHtml(title, entries){
  if(!entries.length) return "";
  return `<div class="stat-h">${title}</div>` + entries.map(([l,avg,n])=>`<div class="bar-row"><div class="bl">${l}</div><div class="bt"><div style="width:${avg*10}%"></div></div><div class="bv">${avg.toFixed(1)} <small style="color:var(--ink-faint);font-weight:400">(${n})</small></div></div>`).join("");
}
function groupAvg(list, keyFn, min){
  const g = {};
  list.forEach(x=>{ keyFn(x).forEach(k=>{ (g[k] = g[k] || []).push(x.rating); }); });
  return Object.entries(g).filter(([k,a])=>a.length>=min).map(([k,a])=>[k, a.reduce((s,v)=>s+v,0)/a.length, a.length]).sort((a,b)=>b[1]-a[1]||b[2]-a[2]);
}
function renderStatsTab(body){
  const list = watchedList();
  if(list.length < 1){ body.innerHTML = `<div class="empty"><div class="display">Sin datos todavía</div>Valora algunas películas para ver tus estadísticas.</div>`; return; }
  body.innerHTML =
    barsHtml("Nota media por premio", groupAvg(list, x=>twinsOf(MOVIES_BY_ID[x.id]||x).map(t=>(AWARD_META[t.award]||{label:t.award}).label), 1)) +
    barsHtml("Nota media por década", groupAvg(list, x=>["Años "+Math.floor(x.year/10)*10], 1).sort((a,b)=>a[0].localeCompare(b[0]))) +
    barsHtml("Por país (2+ películas)", groupAvg(list, x=>((MOVIES_BY_ID[x.id]||{}).country||"").split("/").map(c=>c.trim()).filter(Boolean), 2).slice(0,8)) +
    barsHtml("Directores favoritos (2+ películas)", groupAvg(list, x=>((MOVIES_BY_ID[x.id]||{}).director||"").split(/,| y /).map(c=>c.trim()).filter(Boolean), 2).slice(0,8));
}

document.getElementById("shareBtn").addEventListener("click", ()=>{
  const top = watchedList().sort((a,b)=>b.rating-a.rating||a.title.localeCompare(b.title)).slice(0,10);
  if(!top.length){ showToast("Aún no hay películas valoradas"); return; }
  const text = "🎬 Mi ranking CinePremiadas\n" + top.map((x,i)=>`${i+1}. ${x.title} (${x.year}) — ${x.rating}/10`).join("\n");
  const c = document.createElement("canvas"); c.width = 900; c.height = 180 + top.length*70;
  const g = c.getContext("2d");
  g.fillStyle = "#0e0d0b"; g.fillRect(0,0,c.width,c.height);
  g.fillStyle = "#e6c878"; g.font = "bold 44px Georgia, serif"; g.fillText("CinePremiadas · Mi ranking", 50, 85);
  top.forEach((x,i)=>{
    g.fillStyle = "#8b8071"; g.font = "28px Georgia, serif"; g.fillText(String(i+1), 50, 170+i*70);
    g.fillStyle = "#f2ece1"; g.font = "30px Georgia, serif"; g.fillText(x.title.length>38 ? x.title.slice(0,37)+"…" : x.title, 105, 170+i*70);
    g.fillStyle = "#cf9e3f"; g.font = "bold 30px Georgia, serif"; g.textAlign = "right"; g.fillText(x.rating+"/10", 850, 170+i*70); g.textAlign = "left";
  });
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="modal-box"><img alt="Ranking" src="${c.toDataURL("image/png")}"><textarea readonly>${text}</textarea><div class="actions" style="display:flex;gap:10px"><button class="btn primary" id="cpTxt">Copiar texto</button><button class="btn" id="clModal">Cerrar</button></div><div style="font-size:11.5px;color:var(--ink-faint);margin-top:8px">Para guardar la imagen, mantén pulsada (móvil) o clic derecho (ordenador).</div></div>`;
  document.body.appendChild(m);
  m.querySelector("#clModal").onclick = ()=>m.remove();
  m.addEventListener("click", e=>{ if(e.target===m) m.remove(); });
  m.querySelector("#cpTxt").onclick = ()=>{ const ta = m.querySelector("textarea"); ta.select(); try{ document.execCommand("copy"); showToast("Copiado"); }catch(e){ showToast("Selecciona y copia el texto"); } };
});

function renderAll(){
  renderCard();
  renderProgress();
  if(document.getElementById("view-collection").classList.contains("active")) renderCollection();
}

renderFilters();
renderModeRow();
updateRollState();
initStorage();
</script>
</body>
